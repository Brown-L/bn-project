<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Neon Fauna 首頁"><span class="brand-mark">N<span>F</span></span><span>NEON FAUNA<small>SPECIMEN LAB / 01</small></span></a>
      <div class="top-meta"><span class="live-dot"></span> CONTAINMENT ACTIVE <span class="meta-divider">//</span> 物種觀察中</div>
      <button id="motionToggle" class="motion-toggle" type="button" aria-pressed="false"><span>◉</span> 動態：開啟</button>

    <section id="stage" class="stage" aria-label="可互動的賽博生物展示區">

      <div class="crosshair" aria-hidden="true"></div>
      <div class="stage-footer"><span>拖曳游標以吸引注意</span><span>點擊地面　／　生物會受驚</span><span class="coord">X <b id="coordX">000</b>　 Z <b id="coordZ">000</b></span></div>
      <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
    </section>
    <footer class="bottom-bar"><span>FIELD NOTES <b>01—06</b></span><span class="bottom-center">A SYNTHETIC ORGANISM STUDY <i>✳</i> INTERACTIVE WEB PROTOTYPE</span><span>© NEON FAUNA <b>2025</b></span></footer>
